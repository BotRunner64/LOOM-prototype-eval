[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-prototype"
version = "0.1.0"
description = "Panda tabletop simulation, data generation and export validation"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "scipy>=1.15", "pyarrow>=20", "av>=14"]

[project.optional-dependencies]
sim = ["torch==2.11.0+cu128", "isaacsim[all,extscache]==6.0.1.0", "isaaclab==3.0.0b2.post1"]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.setuptools.packages.find]
include = ["loom_prototype*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
