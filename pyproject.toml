[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "loom-prototype"
version = "0.1.0"
description = "Isaac Sim camera-domain context adaptation prototype"
requires-python = ">=3.12"
dependencies = ["torch>=2.11", "numpy>=2", "scipy>=1.15", "h5py>=3.12", "pillow>=11"]

[project.optional-dependencies]
sim = ["isaacsim[all,extscache]==6.0.1.0", "isaaclab==3.0.0b2.post1"]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.setuptools.packages.find]
include = ["loom_prototype*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
